[project]
name = "unravel-markdown"
version = "0.1.0-dev.1"
description = "Extract source files from a literate Markdown document"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
unravel = "unravel.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unravel"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
tag_format = "v{version}"
build_command = """
uv lock
uv build
"""
assets = ["uv.lock"]
commit_message = "chore(release): {version} [skip ci]"
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.branches.main]
match = "^main$"
prerelease = false

[tool.semantic_release.branches.qa]
match = "^qa$"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.branches.dev]
match = "^dev$"
prerelease = true
prerelease_token = "alpha"

[tool.semantic_release.branches.release_test]
match = "^ci/semantic-release$"
prerelease = true
prerelease_token = "dev"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
mask_initial_release = false
